server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # the chat page moved to its own subdomain on AWS
    location = /projects/gov-chat {
        return 301 https://govbot.ethaneering.com/;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
