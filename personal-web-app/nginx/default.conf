# Public traffic arrives through the cloudflared container, so $remote_addr is the same for every
# visitor; use the visitor IP Cloudflare reports instead, falling back for direct LAN requests.
# rag-api rate limits on this.
map $http_cf_connecting_ip $client_ip {
    ""      $remote_addr;
    default $http_cf_connecting_ip;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # rag-api on its own VM; the trailing slash on proxy_pass strips the /api prefix
    location /api/ {
        proxy_pass http://192.168.1.133:8090/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $client_ip;
        # let streamed answers through as they are generated
        proxy_buffering off;
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
