services:
  web:
    image: nginx:alpine
    restart: unless-stopped

    ports:
      - "8089:80"

    volumes:
      - ./site:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_KEY}
    command:
      - tunnel
      - --no-autoupdate
      - run