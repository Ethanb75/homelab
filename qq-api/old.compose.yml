  open-webui:
    image: ghcr.io/open-webui/open-webui:v0.11.3
    container_name: open-webui
    restart: unless-stopped

    ports:
      - "3000:8080"

    volumes:
      - open-webui-data:/app/backend/data

    depends_on:
      - llama-server

    networks:
      - ai

networks:
  ai:

# where open-webui stores it's data
volumes:
  open-webui-data:

