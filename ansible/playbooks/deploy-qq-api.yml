- name: Deploy qq api
  hosts: qq_api
  become: true

  vars:
    app_dir: /opt/qq-api

  tasks:
    - name: Configure DNS
      ansible.builtin.copy:
        dest: /etc/resolv.conf
        content: |
          nameserver 192.168.1.1
          nameserver 1.1.1.1
        owner: root
        group: root
        mode: "0644" # rw-r--r--: owner (root) can read/write, group and others read-only

    - name: Install Docker and Docker Compose
      ansible.builtin.apt:
        name:
          - docker.io
          - docker-compose
        state: present
        update_cache: true

    - name: Enable Docker
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true
    
    - name: Create application and model directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      loop:
        - "{{ app_dir }}"
        - /srv/llama-models
        - /srv/llama-models/cache


    - name: Download Spark X2.5 Q4_K_M
      ansible.builtin.get_url:
        url: "https://huggingface.co/XHToken/Spark-X2.5-4B-GGUF/resolve/main/Spark-X2.5-4B-Q4_K_M.gguf"
        dest: "/srv/llama-models/Spark-X2.5-4B-Q4_K_M.gguf"
        mode: "0644"

    - name: Copy Docker Compose file
      ansible.builtin.copy:
        src: ../../qq-api/compose.yml
        dest: "{{ app_dir }}/compose.yml"
        mode: "0644"

    - name: Copy Docker env file (llama server)
      ansible.builtin.copy:
        src: ../../qq-api/.env
        dest: "{{ app_dir }}/.env"
        mode: "0600"

    - name: Start Docker Compose project
      community.docker.docker_compose_v2:
        project_src: "{{ app_dir }}"
        state: present
        pull: missing