- name: Deploy vector db
  hosts: vector_db
  become: true

  vars:
    app_dir: /opt/vector-db

  tasks:
    - name: Configure DNS
      ansible.builtin.copy:
        dest: /etc/resolv.conf
        content: |
          nameserver 192.168.1.1
          nameserver 1.1.1.1
        owner: root
        group: root
        mode: "0644" # rw-r--r--: owner (root) can read/write, group and others read-only

    - name: Install Docker and Docker Compose
      ansible.builtin.apt:
        name:
          - docker.io
          - docker-compose
        state: present
        update_cache: true

    - name: Enable Docker
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true
    
    - name: Create application and model directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      loop:
        - "{{ app_dir }}"
        - /srv/qdrant-storage

    - name: Copy Docker Compose file
      ansible.builtin.copy:
        src: ../../vector-db/compose.yml
        dest: "{{ app_dir }}/compose.yml"
        mode: "0644"

    - name: Copy Docker env file
      ansible.builtin.copy:
        src: ../../vector-db/.env
        dest: "{{ app_dir }}/.env"
        mode: "0600"

    - name: Start Docker Compose project
      community.docker.docker_compose_v2:
        project_src: "{{ app_dir }}"
        state: present
        pull: missing
        remove_orphans: true